<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Myshkin 451 profile banner</title>
  <desc id="desc">A dark editorial banner for Myshkin 451, focused on agents, knowledge systems, and personal publishing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101217"/>
      <stop offset="0.55" stop-color="#16191F"/>
      <stop offset="1" stop-color="#0D1015"/>
    </linearGradient>
    <linearGradient id="ink" x1="120" y1="60" x2="1120" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2E8D8"/>
      <stop offset="0.58" stop-color="#D8E5E1"/>
      <stop offset="1" stop-color="#B7C8E6"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#F2E8D8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.72 0 0 0 0 0.78 0 0 0 0 0.92 0 0 0 0.28 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="358" rx="27" stroke="#F2E8D8" stroke-opacity="0.12"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>

  <path d="M92 284C226 213 278 52 423 76C544 96 550 240 675 233C799 226 830 84 964 91C1052 95 1106 160 1188 132" stroke="#D8E5E1" stroke-opacity="0.16" stroke-width="2"/>
  <path d="M86 315C249 263 322 137 465 156C593 173 642 295 765 269C874 246 908 140 1036 158C1094 166 1142 197 1198 190" stroke="#F2E8D8" stroke-opacity="0.10" stroke-width="2"/>

  <g transform="translate(86 62)">
    <text x="0" y="38" fill="#9CA7B7" font-family="monospace" font-size="17" letter-spacing="2.8">PROFILE://MYSHKIN451</text>
    <text x="0" y="128" fill="url(#ink)" font-family="serif" font-size="86" font-weight="700" letter-spacing="1.5" filter="url(#softGlow)">Myshkin 451</text>
    <text x="4" y="178" fill="#D8E5E1" fill-opacity="0.88" font-family="monospace" font-size="22">agents / memory / publishing / public thought</text>
    <text x="4" y="230" fill="#F2E8D8" fill-opacity="0.72" font-family="serif" font-size="24">make private thought legible without flattening it</text>
  </g>

  <g transform="translate(917 56)">
    <rect x="0" y="0" width="250" height="250" rx="24" fill="#0A0D12" fill-opacity="0.54" stroke="#F2E8D8" stroke-opacity="0.14"/>
    <path d="M44 72H206M44 126H206M44 180H206M72 44V206M126 44V206M180 44V206" stroke="#F2E8D8" stroke-opacity="0.12"/>
    <circle cx="72" cy="72" r="8" fill="#F2E8D8" fill-opacity="0.9"/>
    <circle cx="180" cy="72" r="8" fill="#B7C8E6" fill-opacity="0.86"/>
    <circle cx="126" cy="126" r="10" fill="#D8E5E1" fill-opacity="0.92"/>
    <circle cx="72" cy="180" r="8" fill="#B7C8E6" fill-opacity="0.74"/>
    <circle cx="180" cy="180" r="8" fill="#F2E8D8" fill-opacity="0.72"/>
    <path d="M72 72L126 126L180 72M126 126L72 180M126 126L180 180" stroke="#D8E5E1" stroke-opacity="0.62" stroke-width="2"/>
    <text x="38" y="232" fill="#9CA7B7" font-family="monospace" font-size="13" letter-spacing="1.4">context is architecture</text>
  </g>
</svg>
